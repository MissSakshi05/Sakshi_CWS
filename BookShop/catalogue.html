<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogue - Vishnu Online Book Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            height:100%;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        table {
            width: 100%;
            height:80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        img {
            width: 80px;
            height: 120px;
        }
        .add-to-cart {
            background-color: blue;
            color: white;
            padding: 7px;
            border: none;
            cursor: pointer;
            border-radius: 3px;
        }
        .add-to-cart:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book Catalogue</h2>
        <table>
            <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            <tr>
                <td><img src="assets/OOP.webp" alt="Book 1"></td>
                <td>Object Oriented Programming and JAVA</td>
                <td> Swarnalatha Ashok</td>
                <td>$10</td>
                <td><button class="add-to-cart">Add to Cart</button></td>
            </tr>
            <tr>
                <td><img src="assets/CAO.jpg" alt="Book 2"></td>
                <td>Computer Architecture and Organization</td>
                <td>K. VIJAYA</td>
                <td>$15</td>
                <td><button class="add-to-cart">Add to Cart</button></td>
            </tr>
            <tr>
                <td><img src="assets/FLA.jpg" alt="Book 3"></td>
                <td>Formal Language and Automata</td>
                <td>Alberto Pettorossi</td>
                <td>$20</td>
                <td><button class="add-to-cart">Add to Cart</button></td>
            </tr>
        </table>
    </div>

</body>
</html>
